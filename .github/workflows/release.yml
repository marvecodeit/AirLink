name: Release AirLink for macOS

on:
  push:
    tags:
      - "v*"

# Least privilege: individual jobs opt into more only where necessary.
permissions:
  contents: read

concurrency:
  group: airlink-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version tag
    # Stable releases only. Prerelease tags such as v1.1.0-beta.1 must not be
    # published to the stable update feed.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Verify tag matches every version source
        run: |
          set -euo pipefail
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          CARGO_VERSION=$(awk '/^name = "airlink"$/{found=1} found && /^version = /{gsub(/"/, "", $3); print $3; exit}' src-tauri/Cargo.toml)
          test "$GITHUB_REF_NAME" = "v$TAURI_VERSION" || {
            echo "Tag $GITHUB_REF_NAME does not match tauri version $TAURI_VERSION" >&2
            exit 1
          }
          test "$PACKAGE_VERSION" = "$TAURI_VERSION" || {
            echo "package.json $PACKAGE_VERSION does not match tauri version $TAURI_VERSION" >&2
            exit 1
          }
          test "$CARGO_VERSION" = "$TAURI_VERSION" || {
            echo "Cargo.toml $CARGO_VERSION does not match tauri version $TAURI_VERSION" >&2
            exit 1
          }

  build:
    name: ${{ matrix.arch }}
    needs: validate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          # GitHub retired the macOS 13 Intel image. macos-15-intel is the
          # current native Intel runner; macos-15 is the arm64 runner.
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: intel-x86_64
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: apple-silicon-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend checks
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Rust checks
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build, sign and draft release
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: AirLink v__VERSION__
          releaseBody: "AirLink v__VERSION__ — signed update. Full changes: https://github.com/marvecodeit/AirLink/commits/v__VERSION__"
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --config src-tauri/release/stable.conf.json

  publish:
    name: Publish verified release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo marvecodeit/AirLink --draft=false
