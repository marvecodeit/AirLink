name: Build AirLink Linux releases

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} · ${{ github.event.inputs.channel || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04

    runs-on: ${{ matrix.os }}
    env:
      CHANNEL: ${{ github.event.inputs.channel || (contains(github.ref_name, 'beta') && 'beta' || 'stable') }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file pkg-config libssl-dev libdbus-1-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build stable
        if: env.CHANNEL == 'stable' && matrix.platform == 'linux'
        run: npm run build:linux:stable
      - name: Build beta
        if: env.CHANNEL == 'beta' && matrix.platform == 'linux'
        run: npm run build:linux:beta


      - name: Upload Linux bundles
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: airlink-${{ env.CHANNEL }}-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
