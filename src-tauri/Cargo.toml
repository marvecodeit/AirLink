[package]
name = "airlink"
version = "1.0.0"
description = "AirLink — a native macOS captive portal assistant"
authors = ["marvecodeit"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "airlink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "unstable", "image-png", "devtools"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "process", "sync", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset", "gzip", "brotli", "deflate"] }
url = "2"
thiserror = "2"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
if-addrs = "0.15"
libloading = "0.9"
zeroize = "1"
plist = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", features = ["std", "NSString"] }
objc2-core-wlan = { version = "0.3.2", features = ["std"] }
objc2-core-location = { version = "0.3.2", features = ["std", "CLLocationManager"] }
objc2-web-kit = { version = "0.3.2", features = ["std", "WKWebView"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust"] }
webkit2gtk = { version = "=2.0", features = ["v2_40"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
